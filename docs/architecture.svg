<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="'Microsoft JhengHei','PingFang TC','Noto Sans CJK TC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="880" fill="#ffffff"/>
  <text x="600" y="40" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Visual Mask System　系統架構</text>
  <text x="600" y="66" text-anchor="middle" font-size="14" fill="#64748b">為純文字對話生成個人化動態視覺回饋，補償流失的情緒訊號</text>

  <!-- ===== 第一層：輸入感知層 ===== -->
  <rect x="30" y="90" width="1140" height="120" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="48" y="114" font-size="15" font-weight="700" fill="#1d4ed8">① 輸入感知層</text>
  <text x="48" y="132" font-size="11" fill="#3b82f6">Input Perception</text>

  <rect x="190" y="118" width="260" height="72" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="320" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">LINE 訊息</text>
  <text x="320" y="168" text-anchor="middle" font-size="12" fill="#475569">文字 · emoji · 貼圖</text>

  <rect x="480" y="118" width="260" height="72" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="610" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Contextual Buffer</text>
  <text x="610" y="168" text-anchor="middle" font-size="12" fill="#475569">對話語境 · SQLite 持久化</text>

  <rect x="770" y="118" width="300" height="72" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="920" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">多模態融合</text>
  <text x="920" y="168" text-anchor="middle" font-size="12" fill="#475569">文字情緒 + emoji/貼圖情緒</text>

  <line x1="450" y1="154" x2="480" y2="154" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="154" x2="770" y2="154" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== 第二層：推理層 ===== -->
  <rect x="30" y="240" width="1140" height="130" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="48" y="264" font-size="15" font-weight="700" fill="#1d4ed8">② 推理層</text>
  <text x="48" y="282" font-size="11" fill="#3b82f6">Reasoning</text>

  <rect x="190" y="266" width="260" height="82" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="320" y="292" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Affective Analyzer</text>
  <text x="320" y="312" text-anchor="middle" font-size="12" fill="#475569">對話情緒辨識 (ERC)</text>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#94a3b8">LoRA 微調 · 7 類情緒</text>

  <rect x="480" y="266" width="260" height="82" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="610" y="292" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Semantic Intent Decoder</text>
  <text x="610" y="312" text-anchor="middle" font-size="12" fill="#475569">溝通意圖 + 情緒成因</text>
  <text x="610" y="330" text-anchor="middle" font-size="11" fill="#94a3b8">為何這樣說</text>

  <rect x="770" y="266" width="300" height="82" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="920" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Visual Instruction Generator</text>
  <text x="920" y="309" text-anchor="middle" font-size="11" fill="#475569">+ Modality Selector（影片/貼圖）</text>
  <text x="920" y="326" text-anchor="middle" font-size="11" fill="#475569">+ Identity-DB（誰的面具）</text>

  <line x1="450" y1="307" x2="480" y2="307" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="307" x2="770" y2="307" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 感知→推理 -->
  <line x1="920" y1="190" x2="920" y2="230" stroke="#334155" stroke-width="1.6"/>
  <line x1="920" y1="230" x2="320" y2="230" stroke="#334155" stroke-width="1.6"/>
  <line x1="320" y1="230" x2="320" y2="266" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== 合約邊界 ===== -->
  <rect x="770" y="386" width="300" height="34" rx="17" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="920" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">VisualInstruction JSON（合約）</text>
  <line x1="920" y1="348" x2="920" y2="386" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowLoop)"/>

  <!-- ===== 第三層：生成層（隊友） ===== -->
  <rect x="30" y="440" width="1140" height="120" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-dasharray="6 4"/>
  <text x="48" y="464" font-size="15" font-weight="700" fill="#b45309">③ 生成層</text>
  <text x="48" y="482" font-size="11" fill="#d97706">Generation · 隊友負責 · 進行中</text>

  <rect x="480" y="468" width="260" height="72" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="610" y="496" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">AnimateDiff + SD1.5 + LoRA</text>
  <text x="610" y="518" text-anchor="middle" font-size="12" fill="#475569">個人化面具生成</text>

  <rect x="770" y="468" width="300" height="72" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="920" y="496" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">動態視覺面具</text>
  <text x="920" y="518" text-anchor="middle" font-size="12" fill="#475569">影片 / 貼圖</text>

  <line x1="920" y1="420" x2="920" y2="440" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="920" y1="440" x2="610" y2="440" stroke="#334155" stroke-width="1.6"/>
  <line x1="610" y1="440" x2="610" y2="468" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="504" x2="770" y2="504" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 回覆 LINE -->
  <path d="M 1070 504 L 1130 504 L 1130 154 L 1070 154" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1138" y="330" font-size="11" fill="#64748b" transform="rotate(90 1138 330)">回覆到 LINE 群組</text>

  <!-- ===== 第四層：學習迴圈 ===== -->
  <rect x="30" y="590" width="1140" height="120" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="48" y="614" font-size="15" font-weight="700" fill="#1d4ed8">④ 學習迴圈</text>
  <text x="48" y="632" font-size="11" fill="#3b82f6">Learning Loop</text>

  <rect x="480" y="618" width="260" height="72" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="610" y="646" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Feedback Monitor</text>
  <text x="610" y="668" text-anchor="middle" font-size="12" fill="#475569">偵測讚同 / 更正</text>

  <rect x="770" y="618" width="300" height="72" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="920" y="646" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">更正 → 再訓練樣本</text>
  <text x="920" y="668" text-anchor="middle" font-size="12" fill="#475569">M-IT（閉環 RLHF 為未來工作）</text>

  <line x1="740" y1="654" x2="770" y2="654" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="610" y1="540" x2="610" y2="618" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 學習迴圈回饋到推理層（左側曲線） -->
  <path d="M 480 654 L 150 654 L 150 307 L 190 307" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowLoop)"/>
  <text x="130" y="480" font-size="11" fill="#7c3aed" transform="rotate(-90 130 480)">更正資料回饋，改善情緒判讀</text>

  <!-- ===== 圖例 ===== -->
  <rect x="30" y="740" width="1140" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="766" font-size="13" font-weight="700" fill="#334155">圖例</text>

  <rect x="48" y="782" width="26" height="18" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="84" y="796" font-size="12" fill="#334155">本人負責（輸入感知 / 推理 / 學習迴圈）— 已完成並經端到端驗證</text>

  <rect x="48" y="810" width="26" height="18" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="84" y="824" font-size="12" fill="#334155">隊友負責（生成層）— 進行中</text>

  <rect x="620" y="782" width="26" height="18" rx="9" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="656" y="796" font-size="12" fill="#334155">兩層以 VisualInstruction JSON 合約解耦，可平行開發</text>

  <line x1="626" y1="820" x2="646" y2="820" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="656" y="824" font-size="12" fill="#334155">學習迴圈回饋路徑</text>
</svg>
