<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面具管理</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/pages-theme.css"><style>[hidden]{display:none!important}.shell,.card{min-width:0;box-sizing:border-box}.mask-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px}.mask-card{min-width:0;padding:14px;border:1px solid #956D6480;border-radius:16px}.mask-card img{width:100%;max-height:320px;object-fit:contain;aspect-ratio:1}.crop-wrap{max-width:560px;width:100%;margin:16px auto}canvas{display:block;width:100%;height:auto;aspect-ratio:1;touch-action:none}input[type=checkbox]{width:auto}button{margin:6px 6px 6px 0}</style><script src="/static/common.js" defer></script><script src="/static/square_cropper.js?v=2-white-padding" defer></script><script src="/static/masks.js?v=1" defer></script></head>
<body class="setup-body"><main class="shell"><section class="card"><div class="brand">◉ MY MASKS</div><h1>面具管理</h1><p>上傳一張照片建立面具，不需要 LoRA 訓練。先裁切成正方形，再驗證或嘗試中性化，確認預覽後才會啟用。</p><div class="row"><a href="/chats">返回聊天室列表</a><button class="secondary" onclick="logout()">登出</button></div>
<h2>新增面具</h2><label>面具名稱<input id="name" maxlength="100" placeholder="例如：我的日常面具"></label><label>處理方式<select id="mode"><option value="auto">自動中性化這次上傳的照片</option><option value="natural">自然中性照片，不修改表情</option></select></label><p class="hint">誇張表情、遮擋或閉眼不保證能還原；大小眼、歪嘴或不像本人時請不要確認。每組面具只使用這次上傳的照片，不會沿用其他面具的衣服、背景或基底。</p><label>選擇照片<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="hint">每次一張、最大 8 MB。拖曳框內移動；拉四邊或四角縮放，比例固定 1:1。照片外有白色留邊，裁切框可以超出照片，超出部分自動補白；請保留頭髮與下巴。白底不會補回原照已裁掉的五官。後端也會拒絕非正方形裁切。</p><div id="crop-wrap" class="crop-wrap" hidden><canvas id="crop" width="800" height="800" aria-label="正方形照片裁切"></canvas></div><button id="upload" disabled>確認裁切並新增預覽</button><p id="status" role="status"></p><h2>我的面具</h2><p class="hint">待確認面具不會用於聊天。刪除為可還原封存，不刪除歷史訊息圖片。</p><div id="gallery" class="mask-grid"></div></section></main></body></html>
