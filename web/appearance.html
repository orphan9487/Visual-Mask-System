<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>設定外觀 Visual Mask</title><link rel="stylesheet" href="/static/app.css?v=20261002"><link rel="stylesheet" href="/static/pages-theme.css?v=20261017"></head><body class="setup-body"><main class="shell"><section class="card"><div class="brand">◉ APPEARANCE SETUP</div><h1>設定你的基本外觀</h1><p class="muted">這些選項只會輔助生成 prompt，不會取代 FaceID。請依照你希望生成的外觀選擇；不確定的項目可保留預設值。</p><form id="appearance-form"><div class="appearance-grid"><label>性別呈現<select id="gender_presentation"><option value="unspecified">不指定</option><option value="masculine">偏陽剛</option><option value="feminine">偏陰柔</option><option value="neutral">中性</option></select></label><label>年齡區間<select id="age_group"><option value="adult">成年</option><option value="young_adult">青年</option><option value="middle_aged">中年</option><option value="unspecified">不指定</option></select></label><label>髮長<select id="hair_length"><option value="unspecified">不指定</option><option value="short">短髮</option><option value="medium">中長髮</option><option value="long">長髮</option></select></label><label>髮色<select id="hair_color"><option value="unspecified">不指定</option><option value="black">黑色</option><option value="brown">棕色</option><option value="blonde">金色</option><option value="gray">灰色</option></select></label><label>髮型<select id="hair_style"><option value="unspecified">不指定</option><option value="straight">直髮</option><option value="wavy">微捲</option><option value="curly">捲髮</option><option value="side_part">旁分</option><option value="center_part">中分</option></select></label><label>鬍鬚<select id="facial_hair"><option value="unspecified">不指定</option><option value="none">無鬍鬚</option><option value="stubble">鬍渣</option><option value="beard">鬍鬚</option></select></label><label>構圖<select id="framing"><option value="face_only">只顯示臉部（預設）</option><option value="head_and_shoulders">頭部與肩膀</option><option value="portrait">肖像</option><option value="half_body">半身</option></select></label></div><label class="check-row"><input id="glasses" type="checkbox"> 生成時保留眼鏡</label><p class="error" id="error"></p><div class="row"><button type="button" class="secondary" onclick="logout()">登出</button><button>儲存並繼續</button></div></form></section></main><script src="/static/common.js"></script><script>const fields=['gender_presentation','age_group','hair_length','hair_color','hair_style','facial_hair','framing'];const form=document.getElementById('appearance-form');const errorElement=document.getElementById('error');(async()=>{const me=await requireSession({ready:false});if(!me)return;const r=await fetch('/api/appearance',{headers:authHeaders()});if(r.ok){const a=await r.json();fields.forEach(k=>document.getElementById(k).value=a[k]);document.getElementById('glasses').checked=Boolean(a.glasses)}})();form.onsubmit=async e=>{e.preventDefault();errorElement.textContent='';const appearance={};fields.forEach(k=>appearance[k]=document.getElementById(k).value);appearance.glasses=document.getElementById('glasses').checked;const r=await fetch('/api/appearance',{method:'PUT',headers:{...authHeaders(),'Content-Type':'application/json'},body:JSON.stringify(appearance)});const d=await r.json();if(!r.ok){errorElement.textContent=d.detail||'儲存失敗';return}location.replace('/enroll')};</script></body></html>
