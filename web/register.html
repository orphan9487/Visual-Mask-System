<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>註冊 Visual Mask</title><link rel="stylesheet" href="/static/app.css?v=20261002"><link rel="stylesheet" href="/static/pages-theme.css?v=20261017"></head><body class="setup-body auth-page"><main class="shell"><section class="card"><div class="brand">◉ VISUAL MASK</div><h1>建立帳號</h1><p class="muted">下一步上傳照片、正方形裁切並建立你的面具，不需要訓練。</p><form id="register-form"><label>帳號<input id="account" required pattern="[A-Za-z0-9_]{3,50}"></label><label>顯示名稱<input id="username" required></label><label>密碼<input id="password" type="password" minlength="8" required></label><label>再次輸入密碼<input id="confirm-password" type="password" minlength="8" required></label><p class="error" id="error"></p><button>註冊並繼續</button></form><p class="muted"><a href="/login">返回登入</a></p></section></main><script src="/static/common.js"></script><script>const registerForm=document.getElementById('register-form');const accountInput=document.getElementById('account');const usernameInput=document.getElementById('username');const passwordInput=document.getElementById('password');const confirmPasswordInput=document.getElementById('confirm-password');const errorElement=document.getElementById('error');registerForm.onsubmit=async e=>{e.preventDefault();errorElement.textContent='';if(passwordInput.value!==confirmPasswordInput.value){errorElement.textContent='兩次密碼不一致';return}const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:accountInput.value,username:usernameInput.value,password:passwordInput.value})});const d=await r.json();if(!r.ok){errorElement.textContent=d.detail||'註冊失敗';return}saveSession(d);location.replace('/masks')};</script></body></html>
