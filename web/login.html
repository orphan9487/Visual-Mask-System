<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入 Visual Mask</title><link rel="stylesheet" href="/static/app.css?v=20261002"><link rel="stylesheet" href="/static/pages-theme.css?v=20261017"></head><body class="setup-body auth-page"><main class="shell"><section class="card"><div class="brand">◉ VISUAL MASK</div><h1>登入聊天室</h1><p class="muted">登入後可管理照片面具，並使用 LivePortrait 表情聊天室。</p><form id="login-form"><label>帳號<input id="account" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><p class="error" id="error"></p><button>登入</button></form><p class="muted">還沒有帳號？<a href="/register">立即註冊</a></p></section></main><script src="/static/common.js"></script><script>const loginForm=document.getElementById('login-form');const accountInput=document.getElementById('account');const passwordInput=document.getElementById('password');const errorElement=document.getElementById('error');if(token())location.replace('/chats');loginForm.onsubmit=async e=>{e.preventDefault();errorElement.textContent='';const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:accountInput.value,password:passwordInput.value})});const d=await r.json();if(!r.ok){errorElement.textContent=d.detail||'登入失敗';return}saveSession(d);location.replace(d.user.face_profile_status==='ready'?'/chats':'/masks')};</script></body></html>
