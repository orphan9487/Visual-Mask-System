<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Mask Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --ground:#f5f5f3; --surface:#ffffff; --card:#fafaf8; --ink:#1a1c22; --muted:#6c7280;
    --faint:#9a9f98; --border:#ececea; --border-2:#e2e2df;
    --accent:#1c7a68; --accent-2:#2f9e8c; --accent-bg:#e5f4f1;
    --me-bg:#1a1c22; --me-ink:#f4f4f2;
    --warn:#b0673c; --warn-bg:#f8ece3; --danger:#b23b3b;
    --sans:"Manrope",system-ui,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",monospace;
    --radius:10px; --shadow:0 1px 2px rgba(20,22,34,.04),0 8px 26px rgba(20,22,34,.06);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#111218; --surface:#191b22; --card:#1e2028; --ink:#e9eaf0; --muted:#a2a8b6;
    --faint:#70768a; --border:#292c36; --border-2:#333744;
    --accent:#43c3b0; --accent-2:#5fd3c0; --accent-bg:#12312d;
    --me-bg:#e9eaf0; --me-ink:#1a1c22;
    --warn:#e0a45f; --warn-bg:#33261a; --danger:#e07070;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{
    --ground:#111218; --surface:#191b22; --card:#1e2028; --ink:#e9eaf0; --muted:#a2a8b6;
    --faint:#70768a; --border:#292c36; --border-2:#333744;
    --accent:#43c3b0; --accent-2:#5fd3c0; --accent-bg:#12312d;
    --me-bg:#e9eaf0; --me-ink:#1a1c22;
    --warn:#e0a45f; --warn-bg:#33261a; --danger:#e07070;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--ground);color:var(--ink);
    display:flex;justify-content:center;align-items:flex-start;padding:24px 14px;min-height:100vh}
  svg{display:inline-block;vertical-align:middle}
  .ico{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .ico.f{fill:currentColor;stroke:none}

  .app{display:flex;gap:16px;align-items:stretch;width:100%;max-width:872px;justify-content:center}
  #chat-container{flex:1 1 auto;min-width:0;max-width:540px;background:var(--surface);border:1px solid var(--border);
    border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
    height:min(760px,calc(100vh - 48px))}
  #header{padding:16px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--border)}
  #header .mk{width:30px;height:30px;color:var(--accent);flex:none}
  #header .ht{line-height:1.1}
  #header .ht b{font-weight:700;font-size:1rem;letter-spacing:-.01em}
  #header .ht small{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;
    color:var(--faint);text-transform:uppercase;margin-top:2px}
  #themeBtn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:8px;
    color:var(--muted);width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #themeBtn:hover{color:var(--ink);border-color:var(--border-2)}

  #lora-bar{display:flex;align-items:center;gap:9px;padding:9px 18px;background:var(--card);
    border-bottom:1px solid var(--border);font-size:.8rem;color:var(--muted)}
  #lora-bar .lk{width:15px;height:15px;color:var(--muted);flex:none}
  #lora-bar label{white-space:nowrap;font-weight:500}
  #loraSelect{margin-left:auto;padding:5px 10px;border-radius:8px;border:1px solid var(--border-2);
    background:var(--surface);color:var(--ink);font-size:.82rem;font-family:var(--sans);cursor:pointer;max-width:60%}
  #loraSelect:disabled{opacity:.55;cursor:default}

  #messages{flex:1;overflow-y:auto;padding:18px 15px;display:flex;flex-direction:column;gap:13px;background:var(--ground)}
  #messages::-webkit-scrollbar{width:8px}
  #messages::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}
  .sys-msg{align-self:center;display:flex;align-items:center;gap:6px;background:var(--card);
    border:1px solid var(--border);font-size:.74rem;padding:5px 12px;border-radius:999px;color:var(--muted);
    font-family:var(--mono);letter-spacing:.02em;max-width:90%;text-align:center}
  .sys-msg .ico{width:13px;height:13px;color:var(--faint);flex:none}
  .message-box{max-width:86%;display:flex;flex-direction:column;cursor:pointer}
  .row-me{align-self:flex-end;align-items:flex-end}
  .row-ai{align-self:flex-start;align-items:flex-start}
  .bubble{padding:10px 13px;font-size:.92rem;line-height:1.5;border-radius:13px;transition:box-shadow .14s}
  .my-msg .bubble{background:var(--me-bg);color:var(--me-ink);border-bottom-right-radius:4px}
  .user-msg .bubble{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-bottom-left-radius:4px}
  .message-box:hover .bubble{box-shadow:0 0 0 2px var(--border-2)}
  .message-box.selected .bubble{box-shadow:0 0 0 2px var(--accent)}
  .sender{font-size:.68rem;color:var(--faint);margin:0 4px 3px;font-weight:500}
  .analyze-hint{margin-top:9px;display:inline-flex;align-items:center;gap:4px;font-size:.66rem;
    opacity:.62;font-family:var(--mono);letter-spacing:.02em}
  .analyze-hint .ico{width:12px;height:12px}
  .mask-area{margin-top:10px}
  .mask-area img,.mask-area video{max-width:200px;border-radius:12px;border:1px solid var(--border);display:block}
  .mask-loading{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);
    background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px}
  .skeleton{width:120px;height:120px;border-radius:12px;background:
    linear-gradient(100deg,var(--card) 30%,var(--border) 50%,var(--card) 70%);
    background-size:220% 100%;animation:sk 1.3s ease-in-out infinite}
  @keyframes sk{to{background-position:-120% 0}}

  #input-area{display:flex;gap:9px;padding:13px 15px;border-top:1px solid var(--border);background:var(--surface)}
  #messageInput{flex:1;padding:11px 15px;border:1px solid var(--border-2);border-radius:11px;outline:none;
    font-size:.9rem;font-family:var(--sans);background:var(--card);color:var(--ink)}
  #messageInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  #messageInput::placeholder{color:var(--faint)}
  #sendBtn{display:flex;align-items:center;gap:6px;padding:0 16px;background:var(--me-bg);color:var(--me-ink);
    border:none;border-radius:11px;cursor:pointer;font-size:.86rem;font-weight:600;font-family:var(--sans)}
  #sendBtn .ico{width:16px;height:16px}
  #sendBtn:hover{opacity:.9}

  /* ===== 情緒分析 側面板 ===== */
  #analysis-panel{width:316px;flex:none;background:var(--surface);border:1px solid var(--border);
    border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
    height:min(760px,calc(100vh - 48px))}
  .ap-head{padding:16px 18px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);
    font-weight:700;font-size:.95rem}
  .ap-head .ico{width:18px;height:18px;color:var(--accent)}
  .ap-body{flex:1;overflow-y:auto;padding:18px}
  .ap-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;color:var(--faint);gap:12px;font-size:.85rem;line-height:1.6}
  .ap-empty .ico{width:34px;height:34px;opacity:.5}
  .ap-quote{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;
    font-size:.86rem;color:var(--muted);line-height:1.5;margin-bottom:18px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .ap-face{width:76px;height:76px;margin:0 auto 10px}
  .ap-face svg{width:100%;height:100%;display:block}
  .ap-emotion{text-align:center;font-family:var(--mono);font-size:1.15rem;font-weight:500;color:var(--accent);
    letter-spacing:.01em}
  .ap-emotion small{display:block;font-family:var(--sans);font-size:.8rem;color:var(--muted);margin-top:2px;letter-spacing:0}
  .ap-compound{margin-top:13px;text-align:center}
  .ap-compound .cname{font-weight:700;font-size:1rem;padding:4px 15px;border-radius:999px;
    background:var(--warn-bg);color:var(--warn);margin-bottom:9px;display:inline-block}
  .epills{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center}
  .epill{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:.8rem;padding:3px 10px;border-radius:999px}
  .epill .d{width:8px;height:8px;border-radius:50%;flex:none}
  .epill .rk{font-family:var(--mono);font-size:.62rem;font-weight:500;opacity:.85}
  .epills .plus{color:var(--faint);font-weight:400;margin:0 1px}
  .ap-meta{margin-top:20px;display:flex;flex-direction:column;gap:11px}
  .ap-row{display:flex;align-items:center;justify-content:space-between;font-size:.82rem}
  .ap-row span{color:var(--muted)}
  .ap-row b{font-weight:600;font-family:var(--mono);font-size:.85rem}
  .ap-bar{height:7px;background:var(--card);border:1px solid var(--border);border-radius:999px;overflow:hidden}
  .ap-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
  .ap-section{margin-top:22px}
  .ap-label{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin-bottom:7px;display:flex;align-items:center;gap:5px}
  .ap-label .ico{width:12px;height:12px}
  .ap-rationale{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 13px;
    font-size:.85rem;line-height:1.65;color:var(--ink)}
  .ap-fb{margin-top:22px;display:flex;gap:9px}
  .ap-fbbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;
    border:1px solid var(--border-2);border-radius:10px;background:var(--surface);color:var(--muted);
    cursor:pointer;font-size:.84rem;font-weight:600;font-family:var(--sans);transition:.14s}
  .ap-fbbtn .ico{width:16px;height:16px}
  .ap-fbbtn.like:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
  .ap-fbbtn.dislike:hover{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
  .ap-fbmsg{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;
    font-size:.82rem;font-weight:600}
  .ap-fbmsg .ico{width:15px;height:15px}
  .ap-fbmsg.liked{background:var(--accent-bg);color:var(--accent)}
  .ap-fbmsg.disliked{background:var(--warn-bg);color:var(--warn)}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,16,22,.55);backdrop-filter:blur(3px);
    display:flex;justify-content:center;align-items:center;z-index:1000;padding:16px}
  .modal-box{background:var(--surface);border:1px solid var(--border);padding:26px 26px 22px;
    border-radius:16px;min-width:290px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow)}
  #loginModal .mk{width:38px;height:38px;color:var(--accent)}
  .modal-box h2{margin:10px 0 4px;font-size:1.2rem;font-weight:700}
  .modal-box .sub{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 18px}
  .modal-box input{display:block;width:100%;margin:0 0 10px;padding:11px 13px;border:1px solid var(--border-2);
    border-radius:10px;font-size:.9rem;font-family:var(--sans);background:var(--card);color:var(--ink);outline:none}
  .modal-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  .btn-primary{width:100%;margin-top:4px;padding:11px;background:var(--me-bg);color:var(--me-ink);
    border:none;border-radius:10px;cursor:pointer;font-size:.92rem;font-weight:600;font-family:var(--sans)}
  .btn-primary:hover{opacity:.92}
  #loginError{color:var(--danger);margin:10px 0 0;font-size:.82rem;display:none}
  #feedbackBox h3{margin:0 0 4px;font-size:1.05rem;font-weight:700}
  #feedbackBox .note{font-size:.8rem;color:var(--muted);margin:0 0 16px}
  .fb-type-btns{display:flex;gap:11px;margin:4px 0}
  .fb-type-btn{flex:1;padding:16px 8px;border:1px solid var(--border-2);border-radius:12px;background:var(--card);
    color:var(--ink);cursor:pointer;transition:.14s;display:flex;flex-direction:column;align-items:center;gap:8px}
  .fb-type-btn:hover{border-color:var(--accent);background:var(--accent-bg)}
  .fb-type-btn .ico{width:24px;height:24px;color:var(--accent)}
  .fb-type-btn b{font-size:.9rem;font-weight:600}
  .fb-type-btn small{font-size:.72rem;color:var(--muted);line-height:1.3}
  #fbEmotionPanel,#fbIntensityPanel{display:none;margin-top:6px}
  .fb-face-preview{width:64px;height:64px;margin:6px auto 14px}
  .fb-face-preview svg{width:100%;height:100%;display:block}
  #fbEmotionSelect{width:100%;padding:11px;border:1px solid var(--border-2);border-radius:10px;font-size:.9rem;
    font-family:var(--sans);background:var(--card);color:var(--ink);margin-bottom:16px;outline:none}
  #fbEmotionSelect:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  #fbIntensityPanel .lab{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px}
  #fbIntensityPanel .base{font-family:var(--mono);color:var(--ink);font-weight:500}
  #intensitySlider{width:100%;accent-color:var(--accent);margin:4px 0}
  #intensityDisplay{font-family:var(--mono);font-size:1.5rem;font-weight:500;color:var(--accent);margin:6px 0 16px}
  .fb-confirm-btn{padding:10px 30px;background:var(--me-bg);color:var(--me-ink);border:none;border-radius:10px;
    cursor:pointer;font-size:.9rem;font-weight:600;font-family:var(--sans)}
  .fb-confirm-btn:hover{opacity:.92}
  .fb-back-link,.fb-cancel-link{display:block;margin-top:12px;font-size:.78rem;cursor:pointer;color:var(--muted);
    background:none;border:none;width:100%;font-family:var(--sans)}
  .fb-back-link:hover,.fb-cancel-link:hover{color:var(--ink)}

  .spin{width:15px;height:15px;border:2px solid var(--border-2);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin,.skeleton,.ap-bar i{animation:none;transition:none}}

  @media (max-width:900px){
    body{align-items:flex-start}
    .app{flex-direction:column;max-width:540px;align-items:stretch}
    #chat-container{height:min(62vh,560px);max-width:none}
    #analysis-panel{width:100%;height:auto;max-height:52vh}
  }
</style>
</head>
<body>

<div class="overlay" id="loginModal">
  <div class="modal-box" id="loginBox">
    <svg class="mk" viewBox="0 0 24 24" aria-hidden="true"><path class="ico" d="M4 5c3 0 5 1 6 3-1 5-3 8-6 8s-4-4-4-7 1-4 4-4Z"/><path class="ico" d="M20 5c-3 0-5 1-6 3 1 5 3 8 6 8s4-4 4-7-1-4-4-4Z"/></svg>
    <h2>Visual Mask 聊天室</h2>
    <p class="sub">M-CoT 情緒面具</p>
    <input type="text" id="accountInput" placeholder="帳號（如 alice_01）" autocomplete="username">
    <input type="password" id="passwordInput" placeholder="密碼（預設 123456）" autocomplete="current-password">
    <button class="btn-primary" onclick="attemptLogin()">登入</button>
    <p id="loginError"></p>
  </div>
</div>

<div class="overlay" id="feedbackModal" style="display:none">
  <div class="modal-box" id="feedbackBox">
    <div id="fbStep0">
      <h3>哪裡不太對？</h3>
      <p class="note">告訴系統，它會學得更準</p>
      <div class="fb-type-btns">
        <button class="fb-type-btn" onclick="fbChooseType('emotion')">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1-1 5-1 6 0"/></svg>
          <b>情緒判斷有誤</b><small>AI 認錯情緒了</small></button>
        <button class="fb-type-btn" onclick="fbChooseType('intensity')">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M4 12l0-3M20 12l0 3"/><circle cx="12" cy="12" r="2.4" class="f"/></svg>
          <b>強度不對</b><small>表情太強或太弱</small></button>
      </div>
      <button class="fb-cancel-link" onclick="closeFeedbackModal()">取消</button>
    </div>
    <div id="fbEmotionPanel">
      <h3>真正的情緒是什麼？</h3>
      <p class="note" id="fbWrongLabelNote"></p>
      <div class="fb-face-preview" id="fbFacePreview"></div>
      <select id="fbEmotionSelect" onchange="fbUpdateFace()">
        <option value="joy">joy（開心）</option>
        <option value="sadness">sadness（悲傷）</option>
        <option value="anger">anger（憤怒）</option>
        <option value="fear">fear（恐懼）</option>
        <option value="surprise">surprise（驚訝）</option>
        <option value="disgust">disgust（厭惡）</option>
        <option value="neutral">neutral（中性）</option>
      </select>
      <button class="fb-confirm-btn" onclick="submitEmotionFeedback()">確認送出</button>
      <button class="fb-back-link" onclick="fbBack()">← 返回</button>
    </div>
    <div id="fbIntensityPanel">
      <h3>調整情緒強度</h3>
      <p class="note" id="fbIntensityNote"></p>
      <span class="lab">系統判斷：<strong class="base" id="fbBaseVal">—</strong></span>
      <span class="lab" style="margin-top:12px">拖曳到你感受的強度：</span>
      <input type="range" id="intensitySlider" min="0.05" max="1.0" step="0.01"
             oninput="document.getElementById('intensityDisplay').textContent=parseFloat(this.value).toFixed(2)">
      <div id="intensityDisplay">0.50</div>
      <button class="fb-confirm-btn" onclick="submitIntensityFeedback()">確認送出</button>
      <button class="fb-back-link" onclick="fbBack()">← 返回</button>
    </div>
  </div>
</div>

<div class="app">
  <div id="chat-container">
    <div id="header">
      <svg class="mk" viewBox="0 0 24 24" aria-hidden="true"><path class="ico" d="M4 5c3 0 5 1 6 3-1 5-3 8-6 8s-4-4-4-7 1-4 4-4Z"/><path class="ico" d="M20 5c-3 0-5 1-6 3 1 5 3 8 6 8s4-4 4-7-1-4-4-4Z"/></svg>
      <div class="ht"><b>Visual Mask 聊天室</b><small>M-CoT 情緒面具</small></div>
      <button id="themeBtn" onclick="toggleTheme()" aria-label="切換深淺色">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </div>
    <div id="lora-bar">
      <svg class="lk" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" class="ico"/><circle cx="9" cy="9.5" r="1.2" class="f"/><circle cx="15" cy="9.5" r="1.2" class="f"/><path class="ico" d="M9 15c1 1 5 1 6 0"/></svg>
      <label>面具</label>
      <select id="loraSelect" disabled onchange="switchLora(this.value)"><option>載入中…</option></select>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="messageInput" placeholder="輸入訊息…">
      <button id="sendBtn" onclick="sendMessage()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-3-6-7-2Z"/></svg>發送</button>
    </div>
  </div>

  <aside id="analysis-panel">
    <div class="ap-head">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M9 19v-6M14 19V9M19 19v-9"/></svg>
      情緒分析
    </div>
    <div class="ap-body">
      <div class="ap-empty" id="apEmpty">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10h8M8 14h5M4 5h16v12H8l-4 4V5Z"/></svg>
        <span>點選任一則訊息<br>查看它的情緒分析</span>
      </div>
      <div class="ap-content" id="apContent" style="display:none">
        <div class="ap-quote" id="apQuote"></div>
        <div class="ap-face" id="apFace"></div>
        <div class="ap-emotion" id="apEmotion"></div>
        <div class="ap-compound" id="apCompound" style="display:none">
          <div class="cname" id="apCname" style="display:none"></div>
          <div class="epills" id="apPills"></div>
        </div>
        <div class="ap-meta">
          <div class="ap-row"><span>面具</span><b id="apMask">—</b></div>
          <div class="ap-row"><span>情緒強度</span><b id="apIntensityVal">—</b></div>
          <div class="ap-bar"><i id="apBar" style="width:0"></i></div>
        </div>
        <div class="ap-section">
          <div class="ap-label"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.7-1 1.3-1 2.5H9c0-1.2-.3-1.8-1-2.5A6 6 0 0 1 12 3Z"/></svg>推理鏈</div>
          <div class="ap-rationale" id="apRationale"></div>
        </div>
        <div class="ap-fb" id="apFb"></div>
      </div>
    </div>
  </aside>
</div>

<script>
/* ============ 柔和圓臉：情緒 → SVG ============ */
const EMO_HUE={
  amber:{t:"#fbe6b3",d:"#9a6a10"}, blue:{t:"#cfe0f5",d:"#31598a"}, coral:{t:"#f7d2c6",d:"#8a3320"},
  red:{t:"#f6c3b6",d:"#8a2a17"}, purple:{t:"#e6dbf5",d:"#5a3d80"}, teal:{t:"#cdeee6",d:"#2a6a5c"},
  violet:{t:"#dcddf9",d:"#3a3d90"}, orange:{t:"#fbdcc0",d:"#9a5511"}, green:{t:"#dcecc4",d:"#4a6a1e"},
  slate:{t:"#dfe3ea",d:"#4b5566"}
};
const EMO_MAP={
  happy:["smile","amber"], joy:["smile","amber"], joyful:["grin","amber"],
  sad:["cry","blue"], sadness:["cry","blue"], disappoint:["frown","blue"],
  passive:["flat","slate"], withdraw:["flat","slate"], neutral:["flat","slate"],
  angry:["angry","coral"], anger:["angry","coral"], frustrat:["angry","coral"], frustrated:["angry","coral"],
  furious:["rage","red"], rage:["rage","red"], sarcastic:["smirk","purple"],
  anxious:["worried","teal"], stressed:["worried","teal"], overwhelm:["worried","teal"], overwhelmed:["worried","teal"],
  confused:["confused","teal"], fearful:["afraid","violet"], fear:["afraid","violet"],
  surprise:["surprise","orange"], surprised:["surprise","orange"], disgust:["disgust","green"], disgusted:["disgust","green"]
};
const EMO_ZH={happy:"快樂",joyful:"愉悅",joy:"喜悅",sad:"悲傷",sadness:"悲傷",disappoint:"失望",passive:"被動冷漠",
  withdraw:"退縮封閉",neutral:"中性",angry:"生氣",anger:"憤怒",frustrat:"沮喪受阻",frustrated:"沮喪受阻",
  furious:"暴怒",rage:"狂怒",sarcastic:"諷刺",anxious:"焦慮",stressed:"壓力",overwhelm:"不知所措",
  overwhelmed:"不知所措",confused:"困惑",fearful:"恐懼",fear:"恐懼",surprise:"驚訝",surprised:"驚訝",
  disgust:"厭惡",disgusted:"厭惡"};
const EMO_COLOR={joy:"#e6a92e",joyful:"#e6a92e",sadness:"#4f7fd0",sad:"#4f7fd0",anger:"#e0684f",angry:"#e0684f",
  fear:"#45b39a",fearful:"#45b39a",surprise:"#5aa8e0",surprised:"#5aa8e0",disgust:"#9b78d0",disgusted:"#9b78d0",
  neutral:"#8a90a3"};
function emoKey(s){return String(s||"").trim().toLowerCase().replace(/[（(].*$/,"").trim();}
function emoColor(e){return EMO_COLOR[emoKey(e)]||"#8a90a3";}
function faceSvg(emotion){
  const k=emoKey(emotion), spec=EMO_MAP[k]||["flat","slate"], arch=spec[0], h=EMO_HUE[spec[1]], ink=h.d;
  const M=(d)=>`<path d="${d}" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round"/>`;
  let eyes=`<circle cx="15" cy="18.5" r="2" fill="${ink}"/><circle cx="25" cy="18.5" r="2" fill="${ink}"/>`, mouth="", brow="", extra="";
  if(arch==="smile"){mouth=M("M15 26 Q20 31 25 26");}
  else if(arch==="grin"){mouth=`<path d="M14.5 25 Q20 32 25.5 25 Z" fill="${ink}"/>`;eyes=M("M12.5 18.5 Q15 16.5 17.5 18.5")+M("M22.5 18.5 Q25 16.5 27.5 18.5");}
  else if(arch==="frown"){mouth=M("M15 29 Q20 25 25 29");}
  else if(arch==="flat"){mouth=M("M15.5 27.5 L24.5 27.5");}
  else if(arch==="cry"){mouth=M("M15 29.5 Q20 25 25 29.5");brow=M("M12.5 14.5 Q15 13 17.5 14.5")+M("M22.5 14.5 Q25 13 27.5 14.5");extra=`<path d="M25.6 20.5 q1.8 2.7 0 4 q-1.8 -1.3 0 -4z" fill="#4a90d9"/>`;}
  else if(arch==="angry"){mouth=M("M15.5 29 Q20 27 24.5 29");brow=M("M12 15 L17.5 17.6")+M("M28 15 L22.5 17.6");}
  else if(arch==="rage"){mouth=`<path d="M15 27 h10 v3 h-10 z" fill="none" stroke="${ink}" stroke-width="2"/><path d="M17.5 27 v3 M20 27 v3 M22.5 27 v3" stroke="${ink}" stroke-width="1.3"/>`;brow=M("M11.5 14.5 L17.5 17.8")+M("M28.5 14.5 L22.5 17.8");}
  else if(arch==="smirk"){mouth=M("M15 28 Q20 31 26 24");brow=M("M22.5 14.5 L28 12.8");}
  else if(arch==="worried"){mouth=M("M15 28 q3.3 -3 6.5 0 q3.3 3 6.5 0");brow=M("M12.5 14.5 Q15 12.5 17.5 14.5")+M("M22.5 14.5 Q25 12.5 27.5 14.5");}
  else if(arch==="confused"){mouth=M("M15 28.5 q3.3 -2.6 6.5 0 q3.3 2.6 6.5 0");brow=M("M22.5 13.8 Q25 12 27.5 13.6");}
  else if(arch==="afraid"){eyes=`<circle cx="15" cy="18.5" r="3.6" fill="#fff"/><circle cx="25" cy="18.5" r="3.6" fill="#fff"/><circle cx="15" cy="19" r="1.9" fill="${ink}"/><circle cx="25" cy="19" r="1.9" fill="${ink}"/>`;mouth=`<ellipse cx="20" cy="29" rx="3.2" ry="4" fill="none" stroke="${ink}" stroke-width="2"/>`;brow=M("M12.5 13.5 Q15 11.5 17.5 13.5")+M("M22.5 13.5 Q25 11.5 27.5 13.5");}
  else if(arch==="surprise"){mouth=`<circle cx="20" cy="29" r="3.4" fill="none" stroke="${ink}" stroke-width="2"/>`;brow=M("M12.5 14 Q15 12.2 17.5 14")+M("M22.5 14 Q25 12.2 27.5 14");}
  else if(arch==="disgust"){mouth=M("M15 28.5 Q18 26.5 20 28.5 Q22 30.5 25 27.5");eyes=M("M13 18.5 L17 18.5")+M("M23 18.5 L27 18.5");brow=M("M12 14.5 L17.5 15.5")+M("M28 14.5 L22.5 15.5");}
  return `<svg class="face" viewBox="0 0 40 40" role="img" aria-label="${k}"><circle cx="20" cy="20" r="18" fill="${h.t}"/>${brow}${eyes}${mouth}${extra}</svg>`;
}
const IC={
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 1 4 10.5c-.7.7-1 1.3-1 2.5H9c0-1.2-.3-1.8-1-2.5A6 6 0 0 1 12 3Z"/>',
  warn:'<path d="M12 4l9 16H3L12 4ZM12 10v4M12 17h.01"/>',
  up:'<path d="M7 20h2v-9H7zM11 11l3-7q2 0 2 2l-1 4h4q2 0 1.6 2l-1.4 6q-.3 1.4-2.2 1.4H11z"/>',
  down:'<path d="M7 4h2v9H7zM11 13l3 7q2 0 2-2l-1-4h4q2 0 1.6-2l-1.4-6q-.3-1.4-2.2-1.4H11z"/>',
  film:'<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 9h16M8 5v14M16 5v14"/>',
  image:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M5 17l4-4 3 3 3-3 4 4"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  note:'<path d="M6 3h9l4 4v14H6zM15 3v4h4"/>',
  chevron:'<path d="M9 6l6 6-6 6"/>'
};
function ico(name,cls){return `<svg class="ico ${cls||''}" viewBox="0 0 24 24" aria-hidden="true">${IC[name]}</svg>`;}

/* ============ 狀態：每則訊息的分析 ============ */
const analyses={};        /* key -> {el,text,mine,emotion,rationale,activeLora,baseIntensity,done,fb} */
let selectedKey=null, _fbKey=null;

function storeAnalysis(key,d,mine,el){
  analyses[key]={el,text:d.text,mine,emotion:d.ai_label,rationale:d.ai_rationale||"",
    activeLora:d.active_lora??"",baseIntensity:d.base_intensity??0.5,
    emotions:d.emotions||null,compoundName:d.compound_name||null,done:false,fb:null};
}
function selectMessage(key){
  if(!analyses[key])return;
  selectedKey=key;
  for(const k in analyses){if(analyses[k].el)analyses[k].el.classList.toggle("selected",k===key);}
  renderPanel();
  if(window.innerWidth<900){document.getElementById("analysis-panel").scrollIntoView({behavior:"smooth",block:"nearest"});}
}
function renderCompound(a){
  const box=document.getElementById("apCompound"),pills=document.getElementById("apPills"),cn=document.getElementById("apCname");
  const emos=a.emotions;
  if(!emos||emos.length<2){box.style.display="none";return;}
  box.style.display="";
  if(a.compoundName){cn.style.display="";cn.textContent=a.compoundName;}else{cn.style.display="none";}
  function srcTxt(e){return e.source==="context"?"主·語境":e.source==="surface"?"次·表面":(e.role==="primary"?"主":"次");}
  pills.innerHTML=emos.map(e=>{
    const c=emoColor(e.emotion),zh=EMO_ZH[emoKey(e.emotion)]||emoKey(e.emotion);
    return `<span class="epill" style="background:${c}22;color:${c}"><span class="d" style="background:${c}"></span>${zh}<span class="rk">${srcTxt(e)}</span></span>`;
  }).join('<span class="plus">＋</span>');
}
function renderPanel(){
  const empty=document.getElementById("apEmpty"), content=document.getElementById("apContent");
  const a=selectedKey?analyses[selectedKey]:null;
  if(!a){empty.style.display="";content.style.display="none";return;}
  empty.style.display="none";content.style.display="";
  document.getElementById("apQuote").textContent=a.text;
  document.getElementById("apFace").innerHTML=faceSvg(a.emotion);
  document.getElementById("apEmotion").innerHTML=`${escHtml(a.emotion)}<small>${EMO_ZH[emoKey(a.emotion)]||""}</small>`;
  renderCompound(a);
  document.getElementById("apMask").textContent=a.activeLora||"—";
  const v=Math.max(0,Math.min(1,a.baseIntensity||0));
  document.getElementById("apIntensityVal").textContent=v.toFixed(2);
  document.getElementById("apBar").style.width=Math.round(v*100)+"%";
  document.getElementById("apRationale").textContent=a.rationale||"（本則沒有推理鏈）";
  const fb=document.getElementById("apFb");
  if(a.mine&&a.done){
    if(a.fb==="liked"){fb.innerHTML=`<div class="ap-fbmsg liked">${ico("up","f")}已標記準確</div>`;}
    else if(a.fb==="disliked"){fb.innerHTML=`<div class="ap-fbmsg disliked">${ico("down","f")}已送出反饋</div>`;}
    else{
      fb.innerHTML=`<button class="ap-fbbtn like">${ico("up","f")}準確</button><button class="ap-fbbtn dislike">${ico("down","f")}有誤</button>`;
      fb.querySelector(".like").onclick=()=>doLike(selectedKey);
      fb.querySelector(".dislike").onclick=()=>openFeedbackModal(selectedKey);
    }
  }else{fb.innerHTML="";}
}

/* ============ API / WebSocket（協定保留） ============ */
let ws, clientName="";
const HTTP_BASE=(location.protocol==="http:"||location.protocol==="https:")?location.origin:"http://127.0.0.1:8000";
const WS_BASE=HTTP_BASE.replace(/^http/,"ws");

async function attemptLogin(){
  const account=document.getElementById("accountInput").value.trim();
  const password=document.getElementById("passwordInput").value;
  const errEl=document.getElementById("loginError");errEl.style.display="none";
  if(!account||!password){errEl.textContent="請輸入帳號與密碼";errEl.style.display="block";return;}
  try{
    const res=await fetch(`${HTTP_BASE}/api/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account,password})});
    const data=await res.json();
    if(res.ok){document.getElementById("loginModal").style.display="none";clientName=data.username;connectWebSocket();loadMyLoras();}
    else{errEl.textContent=data.detail||"登入失敗";errEl.style.display="block";}
  }catch{errEl.textContent="伺服器連線異常，請確認後端已啟動。";errEl.style.display="block";}
}
async function loadMyLoras(){
  try{
    const res=await fetch(`${HTTP_BASE}/api/my_loras?username=${encodeURIComponent(clientName)}`);
    const data=await res.json();
    const sel=document.getElementById("loraSelect");sel.innerHTML="";
    data.loras.forEach(l=>{const opt=document.createElement("option");opt.value=l.key;opt.textContent=l.display_name;if(l.is_active)opt.selected=true;sel.appendChild(opt);});
    sel.disabled=data.loras.length<=1;
  }catch(e){console.warn("無法載入 LoRA 清單",e);}
}
async function switchLora(loraKey){
  try{
    const res=await fetch(`${HTTP_BASE}/api/set_lora`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:clientName,lora_key:loraKey})});
    const data=await res.json();appendSys(data.message,"image");
  }catch(e){appendSys("切換面具失敗，請確認伺服器狀態。","warn");}
}
function connectWebSocket(){
  ws=new WebSocket(`${WS_BASE}/ws/${encodeURIComponent(clientName)}`);
  const msgDiv=document.getElementById("messages");
  ws.onmessage=function(ev){
    const data=JSON.parse(ev.data);
    if(data.sender==="System"){appendSys(data.text,"info");return;}
    const key=data.msg_id||`${data.sender}::${data.text}`;
    if(data.status==="generating"){
      const mine=data.sender===clientName;
      const el=document.createElement("div");
      el.className="message-box "+(mine?"row-me my-msg":"row-ai user-msg");
      el.innerHTML=`
        ${mine?"":`<span class="sender">${escHtml(data.sender)}</span>`}
        <div class="bubble">
          <span class="msg-text">${escHtml(data.text)}</span>
          <div class="mask-area" id="mask-${CSS.escape(key)}"><span class="skeleton"></span></div>
          <span class="analyze-hint">${ico("chevron")}情緒分析</span>
        </div>`;
      storeAnalysis(key,data,mine,el);
      el.addEventListener("click",()=>selectMessage(key));
      msgDiv.appendChild(el);
      selectMessage(key);
    }else if(data.status==="done"){
      const a=analyses[key], maskEl=document.getElementById(`mask-${CSS.escape(key)}`);
      if(a){a.done=true;if(data.base_intensity!=null)a.baseIntensity=data.base_intensity;}
      if(maskEl&&data.mask_file){
        const ext=data.mask_file.split(".").pop().toLowerCase();
        const media=ext==="mp4"?document.createElement("video"):document.createElement("img");
        media.src=`${HTTP_BASE}/output/${data.mask_file}`;
        if(ext==="mp4"){media.controls=true;media.autoplay=true;media.loop=true;media.muted=true;}else{media.alt="生成面具";}
        maskEl.innerHTML="";maskEl.appendChild(media);
      }
      if(selectedKey===key)renderPanel();
    }else if(data.status==="error"){
      const maskEl=document.getElementById(`mask-${CSS.escape(key)}`);
      if(maskEl){maskEl.innerHTML=`<span class="mask-loading" style="color:var(--danger)">${ico("warn")}生成失敗：${escHtml(data.error||"未知錯誤")}</span>`;}
      else{appendSys(data.error||"生成失敗","warn");}
    }
    msgDiv.scrollTop=msgDiv.scrollHeight;
  };
  ws.onclose=function(){appendSys("連線已中斷，請重新整理頁面。","warn");};
}
function sendMessage(){
  const input=document.getElementById("messageInput");
  if(ws&&ws.readyState===WebSocket.OPEN&&input.value.trim()){ws.send(input.value.trim());input.value="";}
  else if(!ws||ws.readyState!==WebSocket.OPEN){alert("聊天室尚未連線，請先登入！");}
}
function appendSys(msg,icon){
  const msgDiv=document.getElementById("messages");
  const el=document.createElement("div");el.className="sys-msg";
  el.innerHTML=(icon&&IC[icon]?ico(icon):"")+`<span>${escHtml(msg)}</span>`;
  msgDiv.appendChild(el);msgDiv.scrollTop=msgDiv.scrollHeight;
}
function escHtml(str){return String(str??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ============ 回饋（以 message key 為狀態） ============ */
function doLike(key){if(!analyses[key])return;analyses[key].fb="liked";renderPanel();}
function openFeedbackModal(key){
  const a=analyses[key];if(!a)return;
  _fbKey=key;
  document.getElementById("fbStep0").style.display="block";
  document.getElementById("fbEmotionPanel").style.display="none";
  document.getElementById("fbIntensityPanel").style.display="none";
  document.getElementById("feedbackModal").style.display="flex";
}
function closeFeedbackModal(){document.getElementById("feedbackModal").style.display="none";}
function fbUpdateFace(){document.getElementById("fbFacePreview").innerHTML=faceSvg(document.getElementById("fbEmotionSelect").value);}
function fbChooseType(type){
  const a=analyses[_fbKey]||{};
  document.getElementById("fbStep0").style.display="none";
  if(type==="emotion"){
    document.getElementById("fbWrongLabelNote").textContent=`AI 判斷為「${a.emotion}」，請選擇正確情緒：`;
    fbUpdateFace();
    document.getElementById("fbEmotionPanel").style.display="block";
  }else{
    const baseVal=parseFloat(a.baseIntensity??0.5).toFixed(2);
    document.getElementById("fbBaseVal").textContent=baseVal;
    document.getElementById("fbIntensityNote").textContent=`情緒：${a.emotion}`;
    const slider=document.getElementById("intensitySlider");slider.value=baseVal;
    document.getElementById("intensityDisplay").textContent=baseVal;
    document.getElementById("fbIntensityPanel").style.display="block";
  }
}
function fbBack(){
  document.getElementById("fbEmotionPanel").style.display="none";
  document.getElementById("fbIntensityPanel").style.display="none";
  document.getElementById("fbStep0").style.display="block";
}
async function submitEmotionFeedback(){
  const correct=document.getElementById("fbEmotionSelect").value;
  try{
    const res=await fetch(`${HTTP_BASE}/api/emotion_feedback`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:clientName,correct_label:correct})});
    const data=await res.json();closeFeedbackModal();
    if(analyses[_fbKey])analyses[_fbKey].fb="disliked";
    if(selectedKey===_fbKey)renderPanel();
    appendSys(data.message,"note");
  }catch(e){alert("送出反饋失敗，請確認伺服器狀態。");}
}
async function submitIntensityFeedback(){
  const a=analyses[_fbKey]||{};
  const adjusted=parseFloat(document.getElementById("intensitySlider").value);
  try{
    const res=await fetch(`${HTTP_BASE}/api/intensity_feedback`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:clientName,emotion:a.emotion,adjusted_intensity:adjusted,base_intensity:a.baseIntensity})});
    const data=await res.json();closeFeedbackModal();
    if(analyses[_fbKey])analyses[_fbKey].fb="disliked";
    if(selectedKey===_fbKey)renderPanel();
    appendSys(data.message,"image");
  }catch(e){alert("送出反饋失敗，請確認伺服器狀態。");}
}

/* 深/淺色 */
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("vms-theme",t);}catch(e){}}
function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");applyTheme(cur==="dark"?"light":"dark");}
(function(){try{const s=localStorage.getItem("vms-theme");if(s)document.documentElement.setAttribute("data-theme",s);}catch(e){}})();

document.addEventListener("DOMContentLoaded",function(){
  document.getElementById("messageInput").addEventListener("keypress",e=>{if(e.key==="Enter")sendMessage();});
  document.getElementById("passwordInput").addEventListener("keypress",e=>{if(e.key==="Enter")attemptLogin();});
  document.getElementById("feedbackModal").addEventListener("click",function(e){if(e.target===this)closeFeedbackModal();});
  if(location.search.includes("demo")||location.protocol==="file:"){demoSeed();}
});

function demoSeed(){
  document.getElementById("loginModal").style.display="none";
  clientName="demo";
  const sel=document.getElementById("loraSelect");sel.innerHTML="<option>Henry</option>";sel.disabled=true;
  const msgDiv=document.getElementById("messages");
  appendSys("今天","info");
  function ex(text,emotion,rationale,emotions,compound){
    const key=text;
    const el=document.createElement("div");el.className="message-box row-me my-msg";
    el.innerHTML=`<div class="bubble"><span class="msg-text">${escHtml(text)}</span>
      <div class="mask-area"><span class="skeleton"></span></div>
      <span class="analyze-hint">${ico("chevron")}情緒分析</span></div>`;
    storeAnalysis(key,{text,ai_label:emotion,ai_rationale:rationale,active_lora:"Henry",
      base_intensity:0.55,emotions:emotions||null,compound_name:compound||null},true,el);
    analyses[key].done=true;
    el.addEventListener("click",()=>selectMessage(key));
    msgDiv.appendChild(el);
    return key;
  }
  ex("我今天報告被當掉了 😭","sadness","語境顯示明顯挫折；「被當掉」為負面事件，說話者對此感到低落。");
  const last=ex("還好啦 呵呵 😊","sadness",
    "文字看似正面，但『呵呵』搭配前文負面事件，且 emoji 與語氣不一致，判定為口是心非的諷刺。",
    [{emotion:"sadness",role:"primary",source:"context"},{emotion:"joy",role:"secondary",source:"surface"}],
    "口是心非");
  selectMessage(last);
}
</script>
</body>
</html>
