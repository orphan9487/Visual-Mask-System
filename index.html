<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Mask Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }
        #chat-container {
            width: 560px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #header {
            background: #3a7bd5;
            color: white;
            padding: 12px 15px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }
        #lora-bar {
            background: #2a5ba5;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
            color: #cce0ff;
        }
        #lora-bar label { white-space: nowrap; }
        #loraSelect {
            flex: 1;
            padding: 4px 8px;
            border-radius: 4px;
            border: none;
            background: #1e4a8a;
            color: white;
            font-size: 0.9em;
            cursor: pointer;
        }
        #loraSelect:disabled { opacity: 0.5; cursor: default; }
        #messages {
            height: 460px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #e5ddd5;
        }
        .message-box {
            padding: 10px;
            border-radius: 8px;
            max-width: 85%;
            line-height: 1.4;
        }
        .sys-msg {
            align-self: center;
            background: #ddd;
            font-size: .85em;
            padding: 5px 10px;
            border-radius: 15px;
            color: #555;
        }
        .user-msg  { align-self: flex-start; background: white;    border-radius: 0 8px 8px 8px; }
        .my-msg    { align-self: flex-end;   background: #dcf8c6;  border-radius: 8px 0 8px 8px; }
        .ai-analysis {
            font-size: .75em;
            color: #666;
            margin-top: 6px;
            padding-top: 5px;
            border-top: 1px dashed #ccc;
        }
        .ai-label { font-weight: bold; color: #d9534f; }
        .mask-area { margin-top: 6px; }
        .mask-area img, .mask-area video { max-width: 200px; border-radius: 6px; border: 1px solid #ccc; display: block; }

        /* 👍 / 👎 feedback buttons */
        .feedback-row {
            display: flex;
            gap: 6px;
            margin-top: 5px;
        }
        .fb-btn {
            background: none;
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 2px 9px;
            cursor: pointer;
            font-size: 0.85em;
            transition: background 0.15s, border-color 0.15s;
            line-height: 1.4;
        }
        .fb-btn:hover  { background: #f0f0f0; }
        .fb-btn.liked  { background: #dcf8c6; border-color: #5ca85c; }
        .fb-btn.disliked { background: #ffe5e5; border-color: #e55555; }
        .fb-btn:disabled { opacity: 0.5; cursor: default; }

        /* Feedback modal overlay */
        #feedbackModal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,.65);
            display: none; justify-content: center; align-items: center;
            z-index: 2000;
        }
        #feedbackBox {
            background: white;
            padding: 24px 28px;
            border-radius: 12px;
            min-width: 300px;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,.2);
        }
        #feedbackBox h3 {
            margin: 0 0 16px;
            font-size: 1.05em;
            color: #333;
        }
        .fb-type-btns {
            display: flex; gap: 12px; justify-content: center; margin-bottom: 4px;
        }
        .fb-type-btn {
            flex: 1;
            padding: 10px 0;
            border: 2px solid #3a7bd5;
            border-radius: 8px;
            background: white;
            color: #3a7bd5;
            font-size: 0.95em;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .fb-type-btn:hover { background: #3a7bd5; color: white; }

        /* emotion correction panel */
        #fbEmotionPanel { display: none; margin-top: 14px; }
        #fbEmotionPanel select {
            width: 100%; padding: 8px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 0.95em; margin-bottom: 12px;
        }

        /* intensity adjustment panel */
        #fbIntensityPanel { display: none; margin-top: 14px; }
        #fbIntensityPanel label { display: block; font-size: 0.85em; color: #555; margin-bottom: 6px; }
        #intensitySlider { width: 100%; accent-color: #3a7bd5; }
        #intensityDisplay {
            font-size: 1.3em; font-weight: bold; color: #3a7bd5;
            margin: 6px 0 12px;
        }

        .fb-confirm-btn {
            padding: 8px 28px;
            background: #3a7bd5; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-size: 0.95em;
        }
        .fb-confirm-btn:hover { background: #2f63b0; }
        .fb-cancel-link {
            display: block; margin-top: 10px;
            font-size: 0.8em; color: #999; cursor: pointer;
            text-decoration: underline;
        }
        .fb-back-link {
            display: block; margin-top: 8px;
            font-size: 0.8em; color: #3a7bd5; cursor: pointer;
            text-decoration: underline;
        }
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid #aaa;
            border-top-color: #3a7bd5;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            vertical-align: middle;
            margin-right: 4px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #input-area {
            display: flex;
            border-top: 1px solid #ccc;
            padding: 10px;
            background: white;
        }
        #messageInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        #sendBtn {
            padding: 10px 15px;
            margin-left: 10px;
            background: #3a7bd5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #sendBtn:hover { background: #2f63b0; }

        /* Login modal */
        #loginModal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        #loginBox {
            background: white; padding: 30px; border-radius: 10px; text-align: center;
            min-width: 280px;
        }
        #loginBox input {
            display: block; width: 80%; margin: 0 auto 10px; padding: 8px;
            border: 1px solid #ccc; border-radius: 4px;
        }
        #loginBox button {
            padding: 8px 24px; background: #3a7bd5; color: white;
            border: none; border-radius: 5px; cursor: pointer;
        }
        #loginError { color: red; margin-top: 8px; display: none; }
    </style>
</head>
<body>

<!-- Login -->
<div id="loginModal">
    <div id="loginBox">
        <h2>Visual Mask 聊天室</h2>
        <input type="text" id="accountInput" placeholder="帳號 (如 alice_01)">
        <input type="password" id="passwordInput" placeholder="密碼 (預設 123456)">
        <button onclick="attemptLogin()">登入</button>
        <p id="loginError"></p>
    </div>
</div>

<!-- ── Feedback Modal ──────────────────────────────────────────────────────── -->
<div id="feedbackModal">
    <div id="feedbackBox">
        <!-- Step 0: choose type -->
        <div id="fbStep0">
            <h3>💬 什麼讓你不滿意？</h3>
            <div class="fb-type-btns">
                <button class="fb-type-btn" onclick="fbChooseType('emotion')">😶 情緒反饋<br><small style="font-size:0.75em;opacity:.7">AI 情緒判斷有誤</small></button>
                <button class="fb-type-btn" onclick="fbChooseType('intensity')">🎨 圖片反饋<br><small style="font-size:0.75em;opacity:.7">情緒強度不對</small></button>
            </div>
            <span class="fb-cancel-link" onclick="closeFeedbackModal()">取消</span>
        </div>

        <!-- Step 1a: Emotion correction -->
        <div id="fbEmotionPanel">
            <h3>😶 真正的情緒是什麼？</h3>
            <p id="fbWrongLabelNote" style="font-size:.82em;color:#888;margin:0 0 10px"></p>
            <select id="fbEmotionSelect">
                <option value="happy">😊 happy（快樂）</option>
                <option value="joyful">😁 joyful（愉悅）</option>
                <option value="sad">😢 sad（悲傷）</option>
                <option value="disappoint">😞 disappoint（失望）</option>
                <option value="passive">😑 passive（被動冷漠）</option>
                <option value="withdraw">😶 withdraw（退縮封閉）</option>
                <option value="sarcastic">😏 sarcastic（諷刺）</option>
                <option value="anxious">😟 anxious（焦慮）</option>
                <option value="confused">😕 confused（困惑）</option>
                <option value="frustrat">😤 frustrated（沮喪受阻）</option>
                <option value="stressed">😰 stressed（壓力）</option>
                <option value="overwhelm">😵 overwhelmed（不知所措）</option>
                <option value="angry">😠 angry（生氣）</option>
                <option value="disgusted">🤢 disgusted（厭惡）</option>
                <option value="fearful">😨 fearful（恐懼）</option>
                <option value="furious">🤬 furious（暴怒）</option>
                <option value="rage">💢 rage（狂怒）</option>
            </select>
            <button class="fb-confirm-btn" onclick="submitEmotionFeedback()">確認送出</button>
            <span class="fb-back-link" onclick="fbBack()">← 返回</span>
        </div>

        <!-- Step 1b: Intensity adjustment -->
        <div id="fbIntensityPanel">
            <h3>🎨 調整情緒強度</h3>
            <p id="fbIntensityNote" style="font-size:.82em;color:#888;margin:0 0 12px"></p>
            <label>系統判斷的強度：<strong id="fbBaseVal">—</strong></label>
            <label style="margin-top:10px">請拖曳到你感受的強度：</label>
            <input type="range" id="intensitySlider" min="0.05" max="1.0" step="0.01"
                   oninput="document.getElementById('intensityDisplay').textContent = parseFloat(this.value).toFixed(2)">
            <div id="intensityDisplay">0.50</div>
            <button class="fb-confirm-btn" onclick="submitIntensityFeedback()">確認送出</button>
            <span class="fb-back-link" onclick="fbBack()">← 返回</span>
        </div>
    </div>
</div>

<div id="chat-container">
    <div id="header">🎭 Visual Mask M-CoT 聊天室</div>
    <div id="lora-bar">
        <label>🎨 面具：</label>
        <select id="loraSelect" disabled onchange="switchLora(this.value)">
            <option>載入中...</option>
        </select>
    </div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="messageInput" placeholder="輸入訊息...">
        <button id="sendBtn" onclick="sendMessage()">發送</button>
    </div>
</div>

<script>
let ws;
let clientName = "";
const HTTP_BASE = window.location.protocol === "http:" || window.location.protocol === "https:"
    ? window.location.origin
    : "http://127.0.0.1:8000";
const WS_BASE = HTTP_BASE.replace(/^http/, "ws");

async function attemptLogin() {
    const account  = document.getElementById("accountInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    const errEl    = document.getElementById("loginError");
    errEl.style.display = "none";

    if (!account || !password) {
        errEl.textContent = "請輸入帳號與密碼";
        errEl.style.display = "block";
        return;
    }
    try {
        const res  = await fetch(`${HTTP_BASE}/api/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ account, password })
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById("loginModal").style.display = "none";
            clientName = data.username;
            connectWebSocket();
            loadMyLoras();
        } else {
            errEl.textContent = data.detail || "登入失敗";
            errEl.style.display = "block";
        }
    } catch {
        errEl.textContent = "伺服器連線異常，請確認後端已啟動。";
        errEl.style.display = "block";
    }
}

// message key → { maskEscId, emotion, baseIntensity, likeBtn, dislikeBtn }
const pendingMasks = {};
// 目前正在反饋的訊息資訊
let _fbEmotion = "";
let _fbBaseIntensity = 0.5;
let _fbLikeBtn  = null;
let _fbDislikeBtn = null;

// ── LoRA selector ─────────────────────────────────────────────────────────
async function loadMyLoras() {
    try {
        const res  = await fetch(`${HTTP_BASE}/api/my_loras?username=${encodeURIComponent(clientName)}`);
        const data = await res.json();
        const sel  = document.getElementById("loraSelect");
        sel.innerHTML = "";
        data.loras.forEach(l => {
            const opt = document.createElement("option");
            opt.value = l.key;
            opt.textContent = l.display_name;
            if (l.is_active) opt.selected = true;
            sel.appendChild(opt);
        });
        sel.disabled = data.loras.length <= 1; // 只有一個就不用選
    } catch(e) {
        console.warn("無法載入 LoRA 清單", e);
    }
}

async function switchLora(loraKey) {
    try {
        const res = await fetch(`${HTTP_BASE}/api/set_lora`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: clientName, lora_key: loraKey })
        });
        const data = await res.json();
        appendSys(`🎨 ${data.message}`);
    } catch(e) {
        appendSys("⚠️ 切換面具失敗，請確認伺服器狀態。");
    }
}

function connectWebSocket() {
    ws = new WebSocket(`${WS_BASE}/ws/${encodeURIComponent(clientName)}`);
    const msgDiv = document.getElementById("messages");

    ws.onmessage = function(ev) {
        const data = JSON.parse(ev.data);

        if (data.sender === "System") {
            const el = document.createElement("div");
            el.className = "sys-msg";
            el.textContent = data.text;
            msgDiv.appendChild(el);
            msgDiv.scrollTop = msgDiv.scrollHeight;
            return;
        }

        // 用伺服器給的唯一 msg_id 當 key，避免相同文字重送時 DOM id 衝突
        const key = data.msg_id || `${data.sender}::${data.text}`;

        if (data.status === "generating") {
            // Create new message element with spinner
            const el = document.createElement("div");
            el.className = data.sender === clientName ? "message-box my-msg" : "message-box user-msg";
            el.innerHTML = `
                <strong>${data.sender}:</strong> ${escHtml(data.text)}
                <div class="ai-analysis">
                    <span class="ai-label">[情緒]: ${escHtml(data.ai_label)}</span>
                    &nbsp;·&nbsp;
                    <span style="color:#7a9cc4">[面具]: ${escHtml(data.active_lora ?? "")}</span><br>
                    <span title="${escHtml(data.ai_rationale)}">💡 推理鏈 (滑鼠移入查看)</span>
                </div>
                <div class="mask-area" id="mask-${CSS.escape(key)}">
                    <span class="spinner"></span><em>面具生成中...</em>
                </div>
            `;
            // 儲存元資料供反饋按鈕使用（base_intensity 在 "done" 時才完整確認）
            pendingMasks[key] = {
                emotion:       data.ai_label,
                baseIntensity: data.base_intensity ?? 0.5,
            };
            msgDiv.appendChild(el);

        } else if (data.status === "done") {
            const meta  = pendingMasks[key];
            const maskEl = document.getElementById(`mask-${CSS.escape(key)}`);
            if (maskEl && data.mask_file) {
                const ext = data.mask_file.split(".").pop().toLowerCase();
                const media = ext === "mp4"
                    ? document.createElement("video")
                    : document.createElement("img");
                media.src = `${HTTP_BASE}/output/${data.mask_file}`;
                if (ext === "mp4") {
                    media.controls = true;
                    media.autoplay = true;
                    media.loop = true;
                    media.muted = true;
                } else {
                    media.alt = ext === "gif" ? "mask gif" : "mask";
                }
                maskEl.innerHTML = "";
                maskEl.appendChild(media);

                // 只有自己的訊息才顯示反饋按鈕
                if (data.sender === clientName && meta) {
                    const fbRow  = document.createElement("div");
                    fbRow.className = "feedback-row";

                    const likeBtn = document.createElement("button");
                    likeBtn.className = "fb-btn";
                    likeBtn.textContent = "👍";
                    likeBtn.title = "面具準確！";
                    likeBtn.onclick = () => doLike(likeBtn, dislikeBtn);

                    const dislikeBtn = document.createElement("button");
                    dislikeBtn.className = "fb-btn";
                    dislikeBtn.textContent = "👎";
                    dislikeBtn.title = "提供反饋";
                    dislikeBtn.onclick = () =>
                        openFeedbackModal(meta.emotion, data.base_intensity ?? meta.baseIntensity, likeBtn, dislikeBtn);

                    fbRow.appendChild(likeBtn);
                    fbRow.appendChild(dislikeBtn);
                    maskEl.appendChild(fbRow);
                }

                delete pendingMasks[key];
            }
        } else if (data.status === "error") {
            const maskEl = document.getElementById(`mask-${CSS.escape(key)}`);
            if (maskEl) {
                maskEl.innerHTML = `<span style="color:#d9534f">生成失敗：${escHtml(data.error || "未知錯誤")}</span>`;
            } else {
                appendSys(`⚠️ ${data.error || "生成失敗"}`);
            }
        }

        msgDiv.scrollTop = msgDiv.scrollHeight;
    };

    ws.onclose = function() {
        appendSys("連線已中斷，請重新整理頁面。");
    };
}

function sendMessage() {
    const input = document.getElementById("messageInput");
    if (ws && ws.readyState === WebSocket.OPEN && input.value.trim()) {
        ws.send(input.value.trim());
        input.value = "";
    } else if (!ws || ws.readyState !== WebSocket.OPEN) {
        alert("聊天室尚未連線，請先登入！");
    }
}

function appendSys(msg) {
    const msgDiv = document.getElementById("messages");
    const el = document.createElement("div");
    el.className = "sys-msg";
    el.textContent = msg;
    msgDiv.appendChild(el);
    msgDiv.scrollTop = msgDiv.scrollHeight;
}

function escHtml(str) {
    return String(str ?? "")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── 👍 / 👎 Feedback ──────────────────────────────────────────────────────────

function doLike(likeBtn, dislikeBtn) {
    likeBtn.classList.add("liked");
    likeBtn.disabled = true;
    dislikeBtn.disabled = true;
    // 👍 純視覺確認，不送出 API（正面強化訊號可在未來版本加入）
}

function openFeedbackModal(emotion, baseIntensity, likeBtn, dislikeBtn) {
    _fbEmotion      = emotion;
    _fbBaseIntensity = baseIntensity;
    _fbLikeBtn      = likeBtn;
    _fbDislikeBtn   = dislikeBtn;

    // 重置 modal 至 Step 0
    document.getElementById("fbStep0").style.display        = "block";
    document.getElementById("fbEmotionPanel").style.display = "none";
    document.getElementById("fbIntensityPanel").style.display = "none";

    document.getElementById("feedbackModal").style.display = "flex";
}

function closeFeedbackModal() {
    document.getElementById("feedbackModal").style.display = "none";
}

function fbChooseType(type) {
    document.getElementById("fbStep0").style.display = "none";
    if (type === "emotion") {
        document.getElementById("fbWrongLabelNote").textContent =
            `AI 判斷為「${_fbEmotion}」，請選擇正確情緒：`;
        document.getElementById("fbEmotionPanel").style.display = "block";
    } else {
        const baseVal = parseFloat(_fbBaseIntensity).toFixed(2);
        document.getElementById("fbBaseVal").textContent = baseVal;
        document.getElementById("fbIntensityNote").textContent =
            `情緒：${_fbEmotion}`;
        const slider = document.getElementById("intensitySlider");
        slider.value = baseVal;
        document.getElementById("intensityDisplay").textContent = baseVal;
        document.getElementById("fbIntensityPanel").style.display = "block";
    }
}

function fbBack() {
    document.getElementById("fbEmotionPanel").style.display   = "none";
    document.getElementById("fbIntensityPanel").style.display = "none";
    document.getElementById("fbStep0").style.display          = "block";
}

async function submitEmotionFeedback() {
    const correct = document.getElementById("fbEmotionSelect").value;
    try {
        const res = await fetch(`${HTTP_BASE}/api/emotion_feedback`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: clientName, correct_label: correct })
        });
        const data = await res.json();
        closeFeedbackModal();
        if (_fbDislikeBtn) { _fbDislikeBtn.classList.add("disliked"); _fbDislikeBtn.disabled = true; }
        if (_fbLikeBtn)    { _fbLikeBtn.disabled = true; }
        appendSys(`📝 ${data.message}`);
    } catch(e) {
        alert("送出反饋失敗，請確認伺服器狀態。");
    }
}

async function submitIntensityFeedback() {
    const adjusted = parseFloat(document.getElementById("intensitySlider").value);
    try {
        const res = await fetch(`${HTTP_BASE}/api/intensity_feedback`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username:          clientName,
                emotion:           _fbEmotion,
                adjusted_intensity: adjusted,
                base_intensity:    _fbBaseIntensity,
            })
        });
        const data = await res.json();
        closeFeedbackModal();
        if (_fbDislikeBtn) { _fbDislikeBtn.classList.add("disliked"); _fbDislikeBtn.disabled = true; }
        if (_fbLikeBtn)    { _fbLikeBtn.disabled = true; }
        appendSys(`🎨 ${data.message}`);
    } catch(e) {
        alert("送出反饋失敗，請確認伺服器狀態。");
    }
}

document.addEventListener("DOMContentLoaded", function() {
    document.getElementById("messageInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });
    document.getElementById("passwordInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") attemptLogin();
    });
    // 點擊 modal 背景關閉
    document.getElementById("feedbackModal").addEventListener("click", function(e) {
        if (e.target === this) closeFeedbackModal();
    });
});
</script>
</body>
</html>
